<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <title>Arrow Puzzle</title>

  <defs>
    <!-- Solid triangular head: length 1.9 x stroke, base 2.2 x stroke.
         markerUnits="strokeWidth" locks those ratios at any stroke width, and
         refX="0" puts the head base exactly on the path end, so the body stops
         where the head starts with no overlap bulge. -->
    <marker id="head-navy" markerWidth="1.9" markerHeight="2.2"
            refX="0" refY="1.1" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L1.9,1.1 L0,2.2 Z" fill="#0F1B4C"/>
    </marker>
    <marker id="head-blue" markerWidth="1.9" markerHeight="2.2"
            refX="0" refY="1.1" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L1.9,1.1 L0,2.2 Z" fill="#2E90FF"/>
    </marker>

    <filter id="card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000"
                    flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background: rounded square, corner radius 22% of size -->
  <rect x="4" y="4" width="504" height="504" rx="112"
        fill="#FFFFFF" stroke="#E6E8EE" stroke-width="2" filter="url(#card)"/>

  <!-- Maze: orthogonal segments on a 64-unit grid, so parallel strokes sit
       42 units apart. Paths are node-disjoint: none of them touch. -->
  <g fill="none" stroke-width="22" stroke-linecap="butt" stroke-linejoin="miter">
    <path d="M288 352 H224 V416 H288"
          stroke="#0F1B4C"/>
    <path d="M160 224 H96 V160"
          stroke="#0F1B4C"/>
    <path d="M160 160 V96 H96"
          stroke="#0F1B4C" marker-end="url(#head-navy)"/>
    <path d="M224 96 H352 V160"
          stroke="#0F1B4C"/>
    <path d="M416 288 H352 V352 H416"
          stroke="#0F1B4C" marker-end="url(#head-navy)"/>
    <path d="M224 224 V160 H288"
          stroke="#0F1B4C"/>
    <path d="M160 416 H96"
          stroke="#0F1B4C" marker-end="url(#head-navy)"/>
    <path d="M416 160 V96"
          stroke="#0F1B4C" marker-end="url(#head-navy)"/>
    <path d="M352 416 H416"
          stroke="#0F1B4C" marker-end="url(#head-navy)"/>
    <path d="M96 352 V288 H288 V224 H416"
          stroke="#2E90FF" marker-end="url(#head-blue)"/>
  </g>
</svg>
