name: arrow_puzzle
description: A complete arrow puzzle game with 200+ generated, validated levels.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  
  # Persistence
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  
  # Audio
  audioplayers: ^5.2.0
  
  # Animations and effects
  flutter_animate: ^4.1.0
  confetti: ^0.7.0
  
  # Utilities
  uuid: ^4.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: "assets/icon/app_icon_ios.png"
  remove_alpha_ios: true
  min_sdk_android: 21
