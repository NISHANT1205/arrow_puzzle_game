name: arrow_puzzle
description: "Arrow puzzle: tap snake-like arrows to slide them off the board without crashing. Endless, always-solvable levels."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.4.0

  # Persistence
  shared_preferences: ^2.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: "assets/icon/app_icon_ios.png"
  remove_alpha_ios: true
  min_sdk_android: 21
