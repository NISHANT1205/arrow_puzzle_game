name: arrow_puzzle
description: "Offline arrow escape puzzles with 225 curated levels and 3D cube challenges."

publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  flutter_riverpod: ^2.4.0

  # Persistence
  flutter_soloud: ^4.1.7
  shared_preferences: ^2.2.0
  http: ^1.2.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/levels/
    - assets/audio/
    - assets/avatars/puzzle/

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  image_path: "assets/icon/app_icon_ios.png"
  remove_alpha_ios: true
  min_sdk_android: 21
